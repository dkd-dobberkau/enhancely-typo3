name: Publish to TER

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    name: Publish ${{ github.ref_name }} to TER
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check TER credentials
        id: creds
        env:
          TER_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
          TER_USER: ${{ secrets.TYPO3_API_USERNAME }}
        run: |
          if [ -z "$TER_TOKEN" ] || [ -z "$TER_USER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TER credentials not set — skipping TER upload. Customer publishes manually via typo3/tailor."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve TYPO3 extension key
        if: steps.creds.outputs.configured == 'true'
        id: key
        run: |
          KEY=$(php -r "\$c=json_decode(file_get_contents('composer.json'),true);echo \$c['extra']['typo3/cms']['extension-key']??'';")
          if [ -z "$KEY" ]; then echo "extension-key missing in composer.json"; exit 1; fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Build release notes from git log
        id: notes
        if: steps.creds.outputs.configured == 'true'
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            BODY=$(git log --pretty=format:'- %s' "$PREV..${{ github.ref_name }}" --no-merges | grep -v 'chore: Bump version' || true)
          else
            BODY=$(git log --pretty=format:'- %s' --no-merges | grep -v 'chore: Bump version' || true)
          fi
          # TER comment is limited; cap to 1500 chars
          BODY=$(printf '%s' "$BODY" | head -c 1500)
          {
            echo 'comment<<EOF'
            printf '%s\n' "$BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload to TER
        if: steps.creds.outputs.configured == 'true'
        uses: tomasnorre/typo3-upload-ter@v2
        with:
          api-token: ${{ secrets.TYPO3_API_TOKEN }}
          api-username: ${{ secrets.TYPO3_API_USERNAME }}
          extension-key: ${{ steps.key.outputs.key }}
          version: ${{ github.ref_name }}
          comment: ${{ steps.notes.outputs.comment }}
