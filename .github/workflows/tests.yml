name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: PHP ${{ matrix.php }} / TYPO3 ${{ matrix.typo3 }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json declares php ^8.2 and typo3/cms-core ^13.0 || ^14.0 —
        # every combination it claims to support gets exercised here.
        php: ['8.2', '8.3', '8.4']
        typo3: ['^13.0', '^14.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ matrix.typo3 }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.typo3 }}-

      - name: Pin TYPO3 version
        run: composer require --no-update typo3/cms-core:"${{ matrix.typo3 }}" typo3/cms-backend:"${{ matrix.typo3 }}" typo3/cms-frontend:"${{ matrix.typo3 }}" typo3/cms-fluid:"${{ matrix.typo3 }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      # One package per invocation: `composer show` takes [<package> [<version>]],
      # so a second package name is parsed as a version constraint.
      - name: Show resolved versions
        run: |
          composer show typo3/cms-core
          composer show guzzlehttp/guzzle

      - name: Lint PHP files
        run: find Classes Tests Configuration -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run unit tests
        run: composer test

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, json, mbstring
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Reported, not gated. The number on its own says little — what matters is
      # that Client and Middleware, where the business logic sits, stay covered.
      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, json, mbstring
          coverage: none
          tools: composer:v2

      # Deliberately no cache and a fresh resolve: the point is to see what a
      # new installation of this extension would pull in today, not what a
      # cached lock file happened to pin.
      - name: Resolve dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      # Gated, unlike coverage. Because dependencies resolve fresh above, an
      # advisory can only surface here in two cases: no fixed release exists
      # yet, or our own constraint caps below the fix. The second is ours to
      # fix; the first is worth knowing before a user finds out.
      #
      # Note that Composer 2.10 additionally refuses to *install* packages
      # under an advisory by default (config policy.advisories.block), so the
      # "Install dependencies" steps in the other jobs already fail on part of
      # this. That is resolution-time blocking; this step is the explicit
      # report, and it also covers abandoned packages.
      - name: Audit production dependencies
        run: composer audit --no-dev --abandoned=report

      # Advisories in phpunit and friends never reach an installation of this
      # extension. Worth seeing, not worth blocking a release over.
      - name: Audit dev dependencies
        run: composer audit --abandoned=report
        continue-on-error: true
