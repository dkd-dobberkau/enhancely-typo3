services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Enhancely\Enhancely\:
    resource: '../Classes/*'

  Enhancely\Enhancely\Configuration\ExtensionConfiguration:
    public: true

  Enhancely\Enhancely\Middleware\JsonLdMiddleware:
    public: true

  cache.enhancely_etag:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['enhancely_etag']

  # Frontend middleware and backend module share this instance, so both address
  # the same cache entries.
  Enhancely\Enhancely\Cache\JsonLdCache:
    public: true
    arguments:
      $cache: '@cache.enhancely_etag'

  Enhancely\Enhancely\Backend\InfoModule\EnhancelyStatusController:
    public: true

  Enhancely\Enhancely\Backend\InfoModule\JsonLdFetcher:
    public: true

  Enhancely\Enhancely\Backend\InfoModule\UrlResolver:
    public: true

  Enhancely\Enhancely\Backend\InfoModule\SiteTitleProvider:
    public: true

  Enhancely\Enhancely\Backend\InfoModule\JsonLdFetcherInterface: '@Enhancely\Enhancely\Backend\InfoModule\JsonLdFetcher'
  Enhancely\Enhancely\Backend\InfoModule\UrlResolverInterface: '@Enhancely\Enhancely\Backend\InfoModule\UrlResolver'
  Enhancely\Enhancely\Backend\InfoModule\SiteTitleProviderInterface: '@Enhancely\Enhancely\Backend\InfoModule\SiteTitleProvider'
  Enhancely\Enhancely\Configuration\ExtensionConfigurationInterface: '@Enhancely\Enhancely\Configuration\ExtensionConfiguration'
