<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Module"/>

<f:section name="Before">
  <f:asset.script identifier="enhancely-copy-jsonld" src="EXT:enhancely/Resources/Public/JavaScript/CopyJsonLd.js"/>
</f:section>

<f:section name="Content">

<h1><f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:title"/></h1>

<f:if condition="{state.banner}">
  <f:then>
    <f:switch expression="{state.banner}">
      <f:case value="not_configured">
        <f:be.infobox
          title="{f:translate(key:'LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:banner.not_configured')}"
          message="{f:translate(key: state.bannerDetailKey, arguments: state.bannerDetailArguments)}"
          state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
        />
      </f:case>
      <f:case value="disabled">
        <f:be.infobox
          title="{f:translate(key:'LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:banner.disabled')}"
          message="{f:translate(key: state.bannerDetailKey, arguments: state.bannerDetailArguments)}"
          state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
        />
      </f:case>
      <f:case value="site_error">
        <f:be.infobox
          title="{f:translate(key:'LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:banner.site_error')}"
          message="{f:translate(key: state.bannerDetailKey, arguments: state.bannerDetailArguments)}"
          state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::ERROR')}"
        />
      </f:case>
      <f:case value="access_denied">
        <f:be.infobox
          title="{f:translate(key:'LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:banner.access_denied')}"
          message="{f:translate(key: state.bannerDetailKey, arguments: state.bannerDetailArguments)}"
          state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::ERROR')}"
        />
      </f:case>
    </f:switch>
  </f:then>
  <f:else>
    <f:if condition="{pageUid} == 0">
      <f:then>
        <f:be.infobox
          message="No page selected. Pick a page in the page tree."
          state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}"
        />
      </f:then>
      <f:else>

        <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
          <f:render partial="Backend/Status" arguments="{state: state}"/>
          <code class="text-body-secondary">{state.url}</code>
          <form method="post" class="ms-auto">
            <input type="hidden" name="id" value="{pageUid}"/>
            <input type="hidden" name="forceRefresh" value="1"/>
            <input type="hidden" name="formToken" value="{formToken}"/>
            <button type="submit" class="btn btn-default btn-sm"
                    title="{f:translate(key:'LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:refresh.help')}">
              <f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:refresh"/>
            </button>
          </form>
        </div>
        <p class="text-body-secondary small mb-3">
          <f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:refresh.help"/>
        </p>

        <f:if condition="{state.crawledAt}">
          <table class="table table-striped table-hover">
            <tbody>
              <tr>
                <th style="width: 200px"><f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:meta.crawled"/></th>
                <td>{state.crawledAt}</td>
              </tr>
              <tr>
                <th><f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:meta.etag"/></th>
                <td><code>{state.etag}</code></td>
              </tr>
              <tr>
                <th><f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:meta.hash"/></th>
                <td><code>{state.hash}</code></td>
              </tr>
              <tr>
                <th><f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:meta.source"/></th>
                <td>{state.source}</td>
              </tr>
              <tr>
                <th><f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:meta.graphtypes"/></th>
                <td>
                  <f:for each="{state.graphTypes}" as="t" iteration="i">{t}<f:if condition="{i.isLast} == 0">, </f:if></f:for>
                </td>
              </tr>
            </tbody>
          </table>
        </f:if>

        <f:if condition="{state.sanityChecks}">
          <h2 class="h4 mt-4"><f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:sanity.heading"/></h2>
          <f:for each="{state.sanityChecks}" as="check">
            <f:if condition="{check.level} == 'pass'">
              <f:then>
                <f:be.infobox
                  message="{check.message}"
                  state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::OK')}"
                />
              </f:then>
              <f:else>
                <f:be.infobox
                  message="{check.message}"
                  state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
                />
              </f:else>
            </f:if>
          </f:for>
        </f:if>

        <f:if condition="{state.rawJsonLd}">
          <h2 class="h4 mt-4"><f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:raw.heading"/></h2>
          <pre class="enhancely-raw" id="enhancely-rawjsonld">{state.rawJsonLdPretty -> f:format.htmlspecialchars()}</pre>
          <div class="d-flex gap-2 flex-wrap mb-3">
            <button type="button" class="btn btn-default btn-sm"
                    data-enhancely-copy="enhancely-rawjsonld"
                    data-copied-label="{f:translate(key:'LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:raw.copied')}">
              <f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:raw.copy"/>
            </button>
            <a href="https://validator.schema.org/#url={state.url -> f:format.urlencode()}"
               target="_blank" rel="noopener noreferrer"
               class="btn btn-default btn-sm">
              <f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:raw.validate_schema"/>
              <span aria-hidden="true">↗</span>
            </a>
            <a href="https://search.google.com/test/rich-results?url={state.url -> f:format.urlencode()}"
               target="_blank" rel="noopener noreferrer"
               class="btn btn-default btn-sm">
              <f:translate key="LLL:EXT:enhancely/Resources/Private/Language/locallang_mod.xlf:raw.validate_google"/>
              <span aria-hidden="true">↗</span>
            </a>
          </div>
        </f:if>

        <f:if condition="{state.errorMessage}">
          <f:be.infobox
            message="{state.errorMessage}"
            state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::ERROR')}"
          />
        </f:if>

      </f:else>
    </f:if>
  </f:else>
</f:if>

</f:section>
</html>
